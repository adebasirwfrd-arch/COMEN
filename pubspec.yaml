name: comen
description: COMEN — Contractor Management (Weatherford). Zero-file-storage, OneDrive upload link, Task ID, military-grade security.
publish_to: 'none'
version: 3.2.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  supabase_flutter: ^2.8.0
  flutter_riverpod: ^2.6.0
  go_router: ^14.6.0
  fl_chart: ^0.69.0
  flutter_animate: ^4.5.0
  web: ^1.1.0
  http: ^1.2.0
  crypto: ^3.0.0
  uuid: ^4.5.0
  url_launcher: ^6.3.0
  qr_flutter: ^4.1.0
  intl: ^0.20.2
  sentry_flutter: ^8.10.0
  google_fonts: ^6.2.0
  cupertino_icons: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/security/
